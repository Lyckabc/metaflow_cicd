# metaflow-ci.toml - Pipeline configuration for metaflow_cicd project
#
# flows/runner/metaflow_ci.go, test_pipeline.sh와 동일한 build test를 Temporal SDK로 실행.
# 테스트 방법: docs/README_TEST.md 참고.
#
# DB projects 테이블: ci_config_path = "flows/metaflow-ci.toml"
# metaflow_ci.go 기본값: project=metaflow_cicd, repo=https://github.com/Lyckabc/metaflow_cicd, branch=dev

[project]
name = "metaflow_cicd"
# language = "python" # 또는 "go", "java", "android"
# version = "1.2.0"

[build]
# 실행할 메인 파일 (Metaflow 스타일 CI flow)
entrypoint = "flows/runner/metaflow_ci.py"
# 빌드 전 실행할 셸 명령
pre_build = "pip install -r requirements.txt"
# 메인 실행 명령 (Temporal Runner가 호출, RunMetaflowActivity)
command = "python flows/runner/metaflow_ci.py run"

[config]
# 일반적인 설정값 (DB에 넣지 않는 비민감 데이터)
# TARGET_REGION = "ap-northeast-2"
LOG_LEVEL = "DEBUG"

[secrets_mapping]
# [애플리케이션에서 쓸 환경변수명] = [DB secrets 테이블의 secret_key]
DB_HOST = "METAFLOW_CICD_DB_HOST"
DB_PORT = "METAFLOW_CICD_DB_PORT"
DB_NAME = "METAFLOW_CICD_DB_NAME"
DB_USER = "METAFLOW_CICD_DB_USER"
DB_PASSWORD = "METAFLOW_CICD_DB_PASSWORD"
GIT_TOKEN = "LYCKABC_GIT_TOKEN"
REGISTRY_ID = "TOJI_REGISTRY_ID"
REGISTRY_PASSWORD = "TOJI_REGISTRY_PASSWORD"
REGISTRY_URL = "TOJI_REGISTRY_URL"

# [registry] CI(metaflow_ci.py run) 완료 후 ManagerWorkflow가 수행
# 1. registry login - secrets_mapping의 REGISTRY_URL, REGISTRY_ID, REGISTRY_PASSWORD 사용
# 2. docker build - Dockerfile로 이미지 빌드
# 3. docker push - {registry_url}/{service_name}:{branch}-{yymmddhhmm} 형식
[registry]
enabled = true
dockerfile = "Dockerfile"
# image_tag_format = "yymmddhhmm"  # 기본값 (선택)

[artifacts]
# 빌드 완료 후 보관할 결과물 경로
# docker repository도 source에서 가져와서 활용 [DB sources 테이블의 name] 을 통해 가져온 데이터 활용 (host, username, password_text 또는 access_token) 
REGISTRY_NAME = "toji_docker_registry"