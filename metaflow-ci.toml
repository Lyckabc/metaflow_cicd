# metaflow-ci.toml - Pipeline configuration for metaflow_cicd project
# This file describes the CI/CD setup for the metaflow_cicd repository.
# Use these values when inserting into projects/sources/secrets tables.

[project]
name = "metaflow_cicd"
main_repo_url = "https://github.com/lyckabc/metaflow_cicd"
target_branches = ["main", "dev", "^feature/.*", "^release-.*"]
is_active = true
description = "Temporal-based CI/CD pipeline for Metaflow"

[project.ci]
config_path = "metaflow_ci.py"
source_name = ""  # optional: use sources.name if different from main_repo

[project.cd]
config_path = "metaflow_ci.py"
source_name = ""

# Optional: source definition (if using separate Git source)
# [sources.default]
# name = "default"
# type = "git"
# host = "https://github.com/lyckabc/metaflow_cicd"
# description = "Main Git source"

# Secrets (insert into secrets table with project_id)
# [[secrets]]
# key = "REGISTRY_ID"
# value = "admin"
# scope = "prod"
# [[secrets]]
# key = "REGISTRY_PASSWORD"
# value = "your-registry-password"
# scope = "prod"
